<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nobel Quests</title>
</head>
<body>

<h1>Login</h1>

<input id="email-input" type="email" placeholder="Email" required>
<input id="password-input" type="password" placeholder="Password" required>
<button id="email-login-btn">Login with Email</button>

<p>OR</p>

<button id="google-login-btn">Login with Google</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { 
  getAuth, GoogleAuthProvider, signInWithPopup, 
  signInWithEmailAndPassword, onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

// --- Firebase Config ---
const firebaseConfig = {
  apiKey: "AIzaSyB8c8TZsDsgZaQx3t4DWm8x3e0QZHVbj0A",
  authDomain: "te4-nobel-quests.firebaseapp.com",
  projectId: "te4-nobel-quests",
  storageBucket: "te4-nobel-quests.firebasestorage.app",
  messagingSenderId: "1098687895626",
  appId: "1:1098687895626:web:bb4459a0ac7890792c6eb3",
  measurementId: "G-XPPM9PF0TW"
};

// --- Initialize Firebase ---
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
auth.languageCode = 'en';

// --- Google Login ---
const provider = new GoogleAuthProvider();
document.getElementById("google-login-btn").addEventListener("click", () => {
  signInWithPopup(auth, provider)
    .then(() => {
      window.location.href = "logged.html";
    })
    .catch(err => alert("Google Login Error: " + err.message));
});

// --- Email Login ---
document.getElementById("email-login-btn").addEventListener("click", () => {
  const email = document.getElementById("email-input").value;
  const password = document.getElementById("password-input").value;

  if (!email || !password) {
    alert("Please enter both email and password.");
    return;
  }

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      window.location.href = "logged.html";
    })
    .catch(err => {
      if (err.code === "auth/user-not-found") {
        alert("User not found. Please register first.");
      } else if (err.code === "auth/wrong-password") {
        alert("Incorrect password.");
      } else {
        alert("Error: " + err.message);
      }
    });
});

// --- Auto redirect if already logged in ---
onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.href = "logged.html";
  }
});
</script>

</body>
</html>
